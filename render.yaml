# Бесплатный web. Платный worker подключается отдельно через render.worker.example.yaml.
services:
  - type: web
    name: kover-crm-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://biajflaqndrngpeffhrx.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: OTP_SECRET
        generateValue: true
      - key: NOTIFICATION_ENCRYPTION_KEY
        generateValue: true
      - key: REQUEST_LOGGING
        value: "true"
      - key: WORKER_SEND_ENABLED
        value: "false"
